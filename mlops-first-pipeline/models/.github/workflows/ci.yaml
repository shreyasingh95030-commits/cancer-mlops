# GitHub actions workflow
# Automatically GitHub looks for this file `workflows` inside .github/worklows/

#Give workflow a meaningful name
name: Iris ML API - CI Pipeline

# define when github should run this workflow

on:
  # run CI whenever code is pushed to the main branch
  push:
    branches:
      - main
  #Also validate changes before they are merged
  pull_request:
    branches:
      - main
# Permissions
permissions:
  contents: read

# Degine the jobs that make up the pipeline
jobs:
  test-and-build:
    # Git Hub provides a fresh Ubuntu VM for this job
    runs-on: ubuntu-latest

    # Steps
    steps:
      # Step -1 dowload repo content to the runner
      - name: Check out repository
        uses: actions/checkout@v4

      # Step - 02 : python on runner
      - name: INstall Python on Runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Step - 03 : Install the dependencies needed to run the tests
      - name: Install Python Dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      # Step - 04 : Execute the automated tests
      - name: Run automated tests
        run: python -m pytest -v
      
      # Step - 05 : Build image only after tests have passed
      - name: Build Docker Image
        run: docker build -t iris-ml-api:${{ github.sha }} .